<?xml version="1.0"?>
<!-- Default Human-1P keybindings for Samurai Shodown II: WASD + J/K/L (A/B/AB) + U/I/O (C/D/CD) -->
<mameconfig version="10">
    <system name="samsho2">
        <image_directories>
            <device instance="memcard" directory="" />
            <device instance="cartridge" directory="" />
        </image_directories>
        <input>
            <port tag=":edge:joy:JOY1" type="P1_JOYSTICK_UP" mask="1" defvalue="1">
                <newseq type="standard">
                    KEYCODE_W
                </newseq>
            </port>
            <port tag=":edge:joy:JOY1" type="P1_JOYSTICK_DOWN" mask="2" defvalue="2">
                <newseq type="standard">
                    KEYCODE_S
                </newseq>
            </port>
            <port tag=":edge:joy:JOY1" type="P1_JOYSTICK_LEFT" mask="4" defvalue="4">
                <newseq type="standard">
                    KEYCODE_A
                </newseq>
            </port>
            <port tag=":edge:joy:JOY1" type="P1_JOYSTICK_RIGHT" mask="8" defvalue="8">
                <newseq type="standard">
                    KEYCODE_D
                </newseq>
            </port>
            <port tag=":edge:joy:JOY1" type="P1_BUTTON1" mask="16" defvalue="16">
                <newseq type="standard">
                    KEYCODE_J OR KEYCODE_L
                </newseq>
            </port>
            <port tag=":edge:joy:JOY1" type="P1_BUTTON2" mask="32" defvalue="32">
                <newseq type="standard">
                    KEYCODE_K OR KEYCODE_L
                </newseq>
            </port>
            <port tag=":edge:joy:JOY1" type="P1_BUTTON3" mask="64" defvalue="64">
                <newseq type="standard">
                    KEYCODE_U OR KEYCODE_O
                </newseq>
            </port>
            <port tag=":edge:joy:JOY1" type="P1_BUTTON4" mask="128" defvalue="128">
                <newseq type="standard">
                    KEYCODE_I OR KEYCODE_O
                </newseq>
            </port>
            <port tag=":edge:joy:JOY2" type="P2_JOYSTICK_UP" mask="1" defvalue="1">
                <newseq type="standard">
                    KEYCODE_UP
                </newseq>
            </port>
            <port tag=":edge:joy:JOY2" type="P2_JOYSTICK_DOWN" mask="2" defvalue="2">
                <newseq type="standard">
                    KEYCODE_DOWN
                </newseq>
            </port>
            <port tag=":edge:joy:JOY2" type="P2_JOYSTICK_LEFT" mask="4" defvalue="4">
                <newseq type="standard">
                    KEYCODE_LEFT
                </newseq>
            </port>
            <port tag=":edge:joy:JOY2" type="P2_JOYSTICK_RIGHT" mask="8" defvalue="8">
                <newseq type="standard">
                    KEYCODE_RIGHT
                </newseq>
            </port>
            <port tag=":edge:joy:JOY2" type="P2_BUTTON1" mask="16" defvalue="16">
                <newseq type="standard">
                    KEYCODE_1PAD OR KEYCODE_3PAD
                </newseq>
            </port>
            <port tag=":edge:joy:JOY2" type="P2_BUTTON2" mask="32" defvalue="32">
                <newseq type="standard">
                    KEYCODE_2PAD OR KEYCODE_3PAD
                </newseq>
            </port>
            <port tag=":edge:joy:JOY2" type="P2_BUTTON3" mask="64" defvalue="64">
                <newseq type="standard">
                    KEYCODE_4PAD OR KEYCODE_6PAD
                </newseq>
            </port>
            <port tag=":edge:joy:JOY2" type="P2_BUTTON4" mask="128" defvalue="128">
                <newseq type="standard">
                    KEYCODE_5PAD OR KEYCODE_6PAD
                </newseq>
            </port>
        </input>
    </system>
</mameconfig>
